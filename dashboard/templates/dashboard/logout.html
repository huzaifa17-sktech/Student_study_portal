{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<div class="border-top pt-3 text-center">
  <h2 class="mb-3">You are Logged Out</h2>
  <p class="text-muted mb-4">You have successfully logged out of your account.</p>
  <a class="btn btn-danger" href="{% url 'login' %}">Log In Again</a>

  <p class="text-muted mt-3">
    Redirecting to home page in <span id="countdown">3</span> seconds...
  </p>
</div>

<script>
  let seconds = 3;
  const countdownElement = document.getElementById('countdown');

  const interval = setInterval(() => {
      seconds--;
      countdownElement.textContent = seconds;

      if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = "{% url 'home' %}";
      }
  }, 1000);
</script>
{% endblock content %}
